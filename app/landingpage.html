<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{appTitle}}</title>

    <script>
      window["sap-ushell-config"] = {
        defaultRenderer: "fiori2",
        applications: {
          "Student-manage": {
            title: "Manage Student",
            description: "Manage Student",
            additionalInformation:
              "SAPUI5.Component=cdx.ui.usr.studentdashboard",
            applicationType: "SAPUI5",
            url: 'studentdashboard/webapp',
            navigationMode: "embedded",
          },
        },
      };
    </script>

    <script
      src="https://sapui5.hana.ondemand.com/1.152.0/test-resources/sap/ushell/bootstrap/sandbox.js"
      id="sap-ushell-bootstrap"
    ></script>

    <script
      src="https://sapui5.hana.ondemand.com/1.152.0/resources/sap-ui-core.js"
      data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
      data-sap-ui-compat-version="edge"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-frame-options="allow"
      data-sap-ui-view-cache="false"
      data-sap-ui-async="true"
    ></script>

    <script>
      sap.ui.getCore().attachInit(function () {
        sap.ushell.Container.createRenderer().placeAt("content");
      });
    </script>
  </head>

  <body class="sapUiBody" id="content"></body>
</html>
